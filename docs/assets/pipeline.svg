<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
  <title id="title">Demand forecasting project pipeline</title>
  <desc id="desc">AEMO demand and Open-Meteo weather flow through validation, leakage-safe feature engineering, chronological model development, XGBoost, and final holdout evaluation.</desc>
  <rect width="1100" height="280" rx="20" fill="#ffffff"/>
  <text x="46" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">End-to-end forecasting pipeline</text>
  <text x="46" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">Reproducible data acquisition → leakage-safe features → time-aware evaluation</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <rect x="44" y="118" width="150" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="119" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">AEMO</text>
    <text x="119" y="176" text-anchor="middle" font-size="13" fill="#475569">5-min demand</text>
    <text x="119" y="196" text-anchor="middle" font-size="13" fill="#475569">VIC1</text>

    <rect x="44" y="218" width="150" height="42" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="119" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Open-Meteo weather</text>

    <path d="M210 165 H250" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M194 239 C225 239 224 189 250 189" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="266" y="118" width="170" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="351" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Validate + align</text>
    <text x="351" y="176" text-anchor="middle" font-size="13" fill="#475569">continuity checks</text>
    <text x="351" y="196" text-anchor="middle" font-size="13" fill="#475569">backward weather join</text>

    <path d="M436 165 H476" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="492" y="118" width="170" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="577" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Feature engineering</text>
    <text x="577" y="176" text-anchor="middle" font-size="13" fill="#475569">lags + ramps + rolling</text>
    <text x="577" y="196" text-anchor="middle" font-size="13" fill="#475569">calendar + weather</text>

    <path d="M662 165 H702" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="718" y="118" width="150" height="92" rx="14" fill="#eef6ff" stroke="#93c5fd"/>
    <text x="793" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">XGBoost</text>
    <text x="793" y="176" text-anchor="middle" font-size="13" fill="#475569">rolling validation</text>
    <text x="793" y="196" text-anchor="middle" font-size="13" fill="#475569">frozen specification</text>

    <path d="M868 165 H908" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="924" y="118" width="132" height="92" rx="14" fill="#fef2f2" stroke="#fecaca"/>
    <text x="990" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Holdout</text>
    <text x="990" y="176" text-anchor="middle" font-size="13" fill="#475569">May–Jun 2026</text>
    <text x="990" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">78.34 MW MAE</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
