<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Chronological validation design</title>
  <desc id="desc">Timeline showing expanding development data, four rolling validation folds, and the untouched May to June 2026 holdout test period.</desc>
  <rect width="960" height="390" rx="20" fill="#ffffff"/>
  <text x="48" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Chronological validation design</text>
  <text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" fill="#4b5563">No random shuffling · model selection precedes one final holdout evaluation</text>

  <text x="48" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">FULL PROJECT TIMELINE</text>
  <rect x="48" y="150" width="690" height="42" rx="8" fill="#dbeafe"/>
  <rect x="738" y="150" width="174" height="42" rx="8" fill="#fee2e2"/>
  <text x="70" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">Development: Jul 2024 – Apr 2026</text>
  <text x="758" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#991b1b">Holdout: May–Jun 2026</text>

  <text x="48" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">ROLLING VALIDATION WINDOWS</text>

  <text x="48" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Fold 1</text>
  <rect x="112" y="250" width="300" height="24" rx="6" fill="#dbeafe"/>
  <rect x="412" y="250" width="116" height="24" rx="6" fill="#bfdbfe"/>
  <text x="542" y="267" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Sep–Oct 2025</text>

  <text x="48" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Fold 2</text>
  <rect x="112" y="284" width="376" height="24" rx="6" fill="#dbeafe"/>
  <rect x="488" y="284" width="116" height="24" rx="6" fill="#bfdbfe"/>
  <text x="618" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Nov–Dec 2025</text>

  <text x="48" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Fold 3</text>
  <rect x="112" y="318" width="452" height="24" rx="6" fill="#dbeafe"/>
  <rect x="564" y="318" width="116" height="24" rx="6" fill="#bfdbfe"/>
  <text x="694" y="335" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Jan–Feb 2026</text>

  <text x="48" y="366" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Fold 4</text>
  <rect x="112" y="352" width="528" height="24" rx="6" fill="#dbeafe"/>
  <rect x="640" y="352" width="116" height="24" rx="6" fill="#bfdbfe"/>
  <text x="770" y="369" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Mar–Apr 2026</text>
</svg>
