[project]
name = "nem-demand-forecasting"
version = "0.1.0"
description = "Leakage-aware 30-minute Victorian NEM electricity demand forecasting with AEMO data, weather features, and XGBoost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.104",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
